name: BlendEmotes

on:
  push:
    branches: [ "claude/**" ]
    paths: [ "blendemotes/**", ".github/workflows/blendemotes.yml" ]
  workflow_dispatch:

concurrency:
  group: blendemotes-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: blendemotes

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Core tests
        run: ./gradlew -PcoreOnly :core:check --stacktrace --console=plain

  # Reads ci/targets.txt (versions and the loaders tested in game) and ci/probe.txt.
  plan:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
      selftest: ${{ steps.plan.outputs.selftest }}
      prod: ${{ steps.plan.outputs.prod }}
      probe: ${{ steps.plan.outputs.probe }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          bash ci/plan.sh | tee -a "$GITHUB_OUTPUT"
          bash ci/versions.sh || true

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJSON(needs.plan.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # the last one is the default JAVA_HOME that runs Gradle (8.14 cannot run on 25)
          java-version: |
            8
            17
            25
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/xyz/wagyourtail
          key: unimined-${{ hashFiles('blendemotes/tools/unimined/build.sh', 'blendemotes/gradle.properties') }}
      - name: Unimined plugin (pinned lts/1.4 build)
        run: bash tools/unimined/build.sh
      - name: Build mod jars
        run: ./gradlew -PmcVersions=${{ matrix.mc }} build --console=plain --continue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jars-${{ matrix.mc }}
          path: |
            blendemotes/versions/*/build/libs/*.jar
          if-no-files-found: ignore

  # Development helper: prints Minecraft API signatures requested in blendemotes/ci/probe.txt.
  # Lines look like "1.21.1: apiDump -PapiSet=main -PapiClasses=a.b.C" and run as
  # ./gradlew -PmcVersions=1.21.1 :mc-1.21.1:apiDump ..., one parallel job per version.
  probe:
    needs: plan
    if: needs.plan.outputs.probe != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJSON(needs.plan.outputs.probe) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            25
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/xyz/wagyourtail
          key: unimined-${{ hashFiles('blendemotes/tools/unimined/build.sh', 'blendemotes/gradle.properties') }}
      - name: Unimined plugin (pinned lts/1.4 build)
        run: bash tools/unimined/build.sh
      - name: API dump
        run: |
          grep -E "^${{ matrix.mc }}:" ci/probe.txt | cut -d: -f2- | sed "s/^ *//" | while IFS= read -r line; do
            echo "APIDUMP >>>>> $line"
            eval "./gradlew -PmcVersions=${{ matrix.mc }} :mc-${{ matrix.mc }}:$line --console=plain -q --stacktrace" < /dev/null 2>&1 | grep -v -E "^Picked up" | cut -c1-700 || true
          done

  # Starts the game with the mod on every loader: creates a world, plays emotes, takes
  # screenshots and quits (see SelfTest.java). Each job compiles its own version.
  selftest:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.selftest) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            25
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/xyz/wagyourtail
          key: unimined-${{ hashFiles('blendemotes/tools/unimined/build.sh', 'blendemotes/gradle.properties') }}
      - name: Unimined plugin (pinned lts/1.4 build)
        run: bash tools/unimined/build.sh
      - name: Install virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb x11-xserver-utils libgl1-mesa-dri libglx-mesa0 mesa-utils libegl1 libegl-mesa0 mesa-vulkan-drivers libvulkan1 libxrandr2 libxcursor1 libxi6 libxxf86vm1 libopenal1 imagemagick
      - name: Compile
        run: ./gradlew -PmcVersions=${{ matrix.mc }} :mc-${{ matrix.mc }}:${{ matrix.loader }}Classes --console=plain
      - name: Run Minecraft self-test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          # 26.3 opens its window through SDL3: EGL finds a context on the virtual display where GLX
          # does not ("Couldn't find matching GLX visual"); software Vulkan (lavapipe) is its fallback
          SDL_VIDEO_FORCE_EGL: "1"
          BLENDEMOTES_SELFTEST: "1"
        run: |
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew -PmcVersions=${{ matrix.mc }} :mc-${{ matrix.mc }}:${{ matrix.loader }}RunClient -Pselftest --console=plain > selftest.log 2>&1 || echo "run exited with $?"
          grep -E "selftest|BlendEmotes" selftest.log | head -200 || true
          echo "----- exceptions with context -----"
          grep -n -B4 -A20 -E "Exception|FATAL|Mixin apply failed|InvalidInjection|Could not execute entrypoint" selftest.log | cut -c1-400 | head -600 || true
          echo "----- last lines -----"
          tail -60 selftest.log | cut -c1-400 || true
          grep -q BLENDEMOTES_SELFTEST_DONE selftest.log
      - name: Contact sheet (printed so it can be read from the log)
        if: always()
        run: |
          shots=$(find versions/${{ matrix.mc }}/run -name 'blendemotes_*.png' 2>/dev/null | sort)
          if [ -n "$shots" ]; then
            i=0
            for f in $shots; do
              i=$((i+1))
              convert "$f" -gravity center -crop 45%x85%+0+0 +repage -resize 220x220 "$(printf 'small_%02d' $i).jpg"
            done
            echo "$shots"
            montage small_*.jpg -tile 5x -geometry +2+2 -quality 70 sheet.jpg
            echo "SHEET_BEGIN"; base64 -w 120 sheet.jpg; echo "SHEET_END"
          else
            echo "no screenshots"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-${{ matrix.mc }}-${{ matrix.loader }}
          path: |
            blendemotes/selftest.log
            blendemotes/versions/${{ matrix.mc }}/run/**/screenshots/*.png
            blendemotes/versions/${{ matrix.mc }}/run/**/logs/latest.log
          if-no-files-found: ignore

  # The release jars (remapped to the names the real game uses) on the real loaders, installed
  # by HeadlessMC like a launcher would: same self-test as above, without the development
  # environment.
  prod:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: .
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.prod) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jars-${{ matrix.mc }}
          path: jars
      - name: Stage the mod (and Fabric API)
        run: |
          mkdir -p run/mods
          jar=$(find jars -name "blendemotes-mc${{ matrix.mc }}-*-${{ matrix.loader }}.jar" | head -1)
          if [ -z "$jar" ]; then echo "no ${{ matrix.loader }} jar for ${{ matrix.mc }}"; find jars -name '*.jar'; exit 1; fi
          echo "testing $jar"
          cp "$jar" run/mods/
          if [ "${{ matrix.loader }}" = "fabric" ] && [ -n "${{ matrix.fabricApi }}" ]; then
            v="${{ matrix.fabricApi }}"
            # the full jar from Modrinth: on Fabric's maven the old versions are only small stubs
            curl -sfLG --retry 3 "https://api.modrinth.com/v2/project/fabric-api/version" \
              --data-urlencode 'loaders=["fabric"]' --data-urlencode 'game_versions=["${{ matrix.mc }}"]' -o fabric-api.json || echo "[]" > fabric-api.json
            url=$(jq -r --arg v "$v" '([.[] | select(.version_number == $v)] + .) | .[0].files // [] | ((map(select(.primary)) + .) | .[0].url) // empty' fabric-api.json)
            if [ -n "$url" ]; then
              echo "Fabric API from $url"
              curl -sfL --retry 3 -o "run/mods/fabric-api.jar" "$url"
            else
              curl -sfL --retry 3 -o "run/mods/fabric-api.jar" "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$v/fabric-api-$v.jar"
            fi
          fi
          ls -la run/mods
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Install virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb x11-xserver-utils libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 mesa-vulkan-drivers libvulkan1 libxrandr2 libxcursor1 libxi6 libxxf86vm1 libopenal1 imagemagick
      - name: Run the game with the release jar
        uses: headlesshq/mc-runtime-test@4.5.1
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          # 26.3 opens its window through SDL3: EGL finds a context on the virtual display where GLX
          # does not ("Couldn't find matching GLX visual"); software Vulkan (lavapipe) is its fallback
          SDL_VIDEO_FORCE_EGL: "1"
          BLENDEMOTES_SELFTEST: "1"
        with:
          mc: ${{ matrix.mc }}
          modloader: ${{ matrix.loader }}
          regex: .*${{ matrix.loader }}.*
          java: ${{ matrix.java }}
          mc-runtime-test: none
          dummy-assets: "false"
          headlessmc-command: --jvm "-Djava.awt.headless=true -Dblendemotes.selftest=true"
      - name: Check the self-test
        if: always()
        run: |
          # every log of the game: Forge 1.8.9-1.12.2 writes the client to its own file (under
          # HeadlessMC its name even has spaces), so the folder is searched instead of listed
          ls -la run/logs || true
          grep -rh --include="*.log" -E "selftest|BlendEmotes" run/logs | head -100 || true
          echo "----- exceptions with context -----"
          grep -rn --include="*.log" -B4 -A20 -E "Exception|FATAL|Mixin apply failed|InvalidInjection" run/logs | cut -c1-400 | head -300 || true
          grep -rq --include="*.log" BLENDEMOTES_SELFTEST_DONE run/logs
      - name: Contact sheet
        if: always()
        run: |
          shots=$(find run -name 'blendemotes_*.png' 2>/dev/null | sort)
          if [ -n "$shots" ]; then
            i=0
            for f in $shots; do
              i=$((i+1))
              convert "$f" -gravity center -crop 45%x85%+0+0 +repage -resize 220x220 "$(printf 'small_%02d' $i).jpg"
            done
            montage small_*.jpg -tile 5x -geometry +2+2 -quality 70 sheet.jpg
            echo "SHEET_BEGIN"; base64 -w 120 sheet.jpg; echo "SHEET_END"
          else
            echo "no screenshots"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-${{ matrix.mc }}-${{ matrix.loader }}
          path: |
            run/logs/latest.log
            run/crash-reports/*
            run/screenshots/*.png
          if-no-files-found: ignore
