name: BlendEmotes

on:
  push:
    branches: [ "claude/**" ]
    paths: [ "blendemotes/**", ".github/workflows/blendemotes.yml" ]
  workflow_dispatch:

concurrency:
  group: blendemotes-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: blendemotes

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests
        run: ./gradlew -PcoreOnly :core:check --stacktrace --console=plain
      - name: Build mods
        run: ./gradlew build --stacktrace --console=plain
      - name: List run tasks
        if: always()
        run: ./gradlew :mc-1.8.9:tasks --all --console=plain | grep -i -E "^run|remap" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jars
          path: |
            blendemotes/versions/*/build/libs/*.jar
          if-no-files-found: ignore
