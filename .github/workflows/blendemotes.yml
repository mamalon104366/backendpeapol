name: BlendEmotes

on:
  push:
    branches: [ "claude/**" ]
    paths: [ "blendemotes/**", ".github/workflows/blendemotes.yml" ]
  workflow_dispatch:

concurrency:
  group: blendemotes-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: blendemotes

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Core tests
        run: ./gradlew -PcoreOnly :core:check --stacktrace --console=plain

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mc: [ "1.8.9", "1.20.1" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build mod jars
        run: ./gradlew -PmcVersions=${{ matrix.mc }} build --console=plain --continue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jars-${{ matrix.mc }}
          path: |
            blendemotes/versions/*/build/libs/*.jar
          if-no-files-found: ignore

  # Development helper: prints Minecraft API signatures listed in blendemotes/ci/probe.txt
  # (one Gradle invocation per line, e.g. ":mc-1.20.1:apiDump -PapiClasses=a.b.C").
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check for probe requests
        id: check
        run: |
          if [ -s ci/probe.txt ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        if: steps.check.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.run == 'true'
        with:
          cache-read-only: false
      - name: Loader versions
        if: steps.check.outputs.run == 'true'
        run: bash ci/versions.sh || true
      - name: API dump
        if: steps.check.outputs.run == 'true'
        run: |
          grep -v -E '^\s*(#|$)' ci/probe.txt | while IFS= read -r line; do
            echo "APIDUMP >>>>> $line"
            eval "./gradlew $line --console=plain -q" < /dev/null 2>&1 | grep -E "APIDUMP|error|Error|FAIL" | cut -c1-600 || true
          done

  selftest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: mc-1.8.9
            dir: versions/1.8.9
            task: forgeRunClient
          - project: mc-1.8.9
            dir: versions/1.8.9
            task: fabricRunClient
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb x11-xserver-utils libgl1-mesa-dri libglx-mesa0 mesa-utils libxrandr2 libxcursor1 libxi6 libxxf86vm1 libopenal1
      - name: Run Minecraft self-test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          BLENDEMOTES_SELFTEST: "1"
        run: |
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :${{ matrix.project }}:${{ matrix.task }} -Pselftest --console=plain > selftest.log 2>&1 || echo "run exited with $?"
          grep -E "selftest|BlendEmotes|Exception|Error|error" selftest.log | head -200 || true
          echo "----- last lines -----"
          tail -60 selftest.log | cut -c1-400 || true
          grep -q BLENDEMOTES_SELFTEST_DONE selftest.log
      - name: Contact sheet (printed so it can be read from the log)
        if: always()
        run: |
          shots=$(ls ${{ matrix.dir }}/run/screenshots/blendemotes_*.png 2>/dev/null | sort)
          if [ -n "$shots" ]; then
            i=0
            for f in $shots; do
              i=$((i+1))
              convert "$f" -gravity center -crop 45%x85%+0+0 +repage -resize 220x220 "$(printf 'small_%02d' $i).jpg"
            done
            ls ${{ matrix.dir }}/run/screenshots/
            montage small_*.jpg -tile 5x -geometry +2+2 -quality 70 sheet.jpg
            echo "SHEET_BEGIN"; base64 -w 120 sheet.jpg; echo "SHEET_END"
          else
            echo "no screenshots"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-${{ matrix.project }}-${{ matrix.task }}
          path: |
            blendemotes/selftest.log
            blendemotes/${{ matrix.dir }}/run/screenshots/*.png
            blendemotes/${{ matrix.dir }}/run/logs/latest.log
          if-no-files-found: ignore
