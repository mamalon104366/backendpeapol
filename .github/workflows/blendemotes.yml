name: BlendEmotes

on:
  push:
    branches: [ "claude/**" ]
    paths: [ "blendemotes/**", ".github/workflows/blendemotes.yml" ]
  workflow_dispatch:

concurrency:
  group: blendemotes-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: blendemotes

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Core tests
        run: ./gradlew -PcoreOnly :core:check --stacktrace --console=plain

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mc: [ "1.8.9", "1.12.2", "1.20.1" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # the last one is the default JAVA_HOME that runs Gradle (8.14 cannot run on 25)
          java-version: |
            8
            17
            25
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build mod jars
        run: ./gradlew -PmcVersions=${{ matrix.mc }} build --console=plain --continue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jars-${{ matrix.mc }}
          path: |
            blendemotes/versions/*/build/libs/*.jar
          if-no-files-found: ignore

  # Development helper: prints Minecraft API signatures requested in blendemotes/ci/probe.txt.
  # Lines look like "1.21.1: apiDump -PapiSet=main -PapiClasses=a.b.C" and run as
  # ./gradlew -PmcVersions=1.21.1 :mc-1.21.1:apiDump ..., one parallel job per version.
  probe-plan:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          v=$( (grep -v -E '^\s*(#|$)' ci/probe.txt 2>/dev/null || true) | cut -d: -f1 | sort -u | jq -R . | jq -s -c . )
          echo "versions=${v:-[]}" >> "$GITHUB_OUTPUT"
          echo "probe versions: ${v:-[]}"
          bash ci/versions.sh || true

  probe:
    needs: probe-plan
    if: needs.probe-plan.outputs.versions != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJSON(needs.probe-plan.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # the last one is the default JAVA_HOME that runs Gradle (8.14 cannot run on 25)
          java-version: |
            8
            17
            25
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: API dump
        run: |
          grep -E "^${{ matrix.mc }}:" ci/probe.txt | cut -d: -f2- | sed "s/^ *//" | while IFS= read -r line; do
            echo "APIDUMP >>>>> $line"
            eval "./gradlew -PmcVersions=${{ matrix.mc }} :mc-${{ matrix.mc }}:$line --console=plain -q" < /dev/null 2>&1 | grep -v -E "^\s*at |^Picked up" | cut -c1-700 || true
          done

  selftest:
    needs: build
    # each job compiles its own version, so a failed build elsewhere does not block it
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: mc-1.8.9
            dir: versions/1.8.9
            task: forgeRunClient
          - project: mc-1.8.9
            dir: versions/1.8.9
            task: fabricRunClient
          - project: mc-1.12.2
            dir: versions/1.12.2
            task: forgeRunClient
          - project: mc-1.12.2
            dir: versions/1.12.2
            task: fabricRunClient
          - project: mc-1.20.1
            dir: versions/1.20.1
            task: forgeRunClient
          - project: mc-1.20.1
            dir: versions/1.20.1
            task: fabricRunClient
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # the last one is the default JAVA_HOME that runs Gradle (8.14 cannot run on 25)
          java-version: |
            8
            17
            25
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb x11-xserver-utils libgl1-mesa-dri libglx-mesa0 mesa-utils libxrandr2 libxcursor1 libxi6 libxxf86vm1 libopenal1
      - name: Run Minecraft self-test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          BLENDEMOTES_SELFTEST: "1"
        run: |
          timeout 1200 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :${{ matrix.project }}:${{ matrix.task }} -Pselftest --console=plain > selftest.log 2>&1 || echo "run exited with $?"
          grep -E "selftest|BlendEmotes" selftest.log | head -200 || true
          echo "----- exceptions with context -----"
          grep -n -B4 -A20 -E "Exception|FATAL|Mixin apply failed|InvalidInjection" selftest.log | cut -c1-400 | head -600 || true
          echo "----- last lines -----"
          tail -60 selftest.log | cut -c1-400 || true
          grep -q BLENDEMOTES_SELFTEST_DONE selftest.log
      - name: Contact sheet (printed so it can be read from the log)
        if: always()
        run: |
          shots=$(find ${{ matrix.dir }}/run -name 'blendemotes_*.png' 2>/dev/null | sort)
          if [ -n "$shots" ]; then
            i=0
            for f in $shots; do
              i=$((i+1))
              convert "$f" -gravity center -crop 45%x85%+0+0 +repage -resize 220x220 "$(printf 'small_%02d' $i).jpg"
            done
            echo "$shots"
            montage small_*.jpg -tile 5x -geometry +2+2 -quality 70 sheet.jpg
            echo "SHEET_BEGIN"; base64 -w 120 sheet.jpg; echo "SHEET_END"
          else
            echo "no screenshots"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-${{ matrix.project }}-${{ matrix.task }}
          path: |
            blendemotes/selftest.log
            blendemotes/${{ matrix.dir }}/run/**/screenshots/*.png
            blendemotes/${{ matrix.dir }}/run/**/logs/latest.log
          if-no-files-found: ignore
