// Build logic shared by the "modern" Minecraft modules (Mojang mappings, 1.16.5 and newer).
//
// A module's build.gradle only declares the plugins, then sets and applies:
//
//     ext {
//         mcVersion = 12101          // 1.21.1 (major * 10000 + minor * 100 + patch; 26.3 -> 260300)
//         minecraft = "1.21.1"
//         javaVersion = 21
//         fabricLoader = "0.16.14"
//         fabricApiVersion = "0.116.6+1.21.1"
//         forge = "52.1.0"           // optional: MinecraftForge version (without the MC prefix)
//         neoforge = "21.1.200"      // optional
//         mcRange = "[1.21.1]"       // accepted Minecraft versions (Forge style)
//         fabricMc = "~1.21.1"       // accepted Minecraft versions (Fabric style)
//     }
//     apply from: rootProject.file("gradle/modern.gradle")
//
// Sources come from shared/modern/<set> (preprocessed with //#if MC >= ..., see
// gradle/preprocess.gradle) plus the module's own src/<set> folders.

ext.sharedRoot = rootProject.file("shared/modern")

// Fabric API modules the mod uses (see fabric.mod.json), plus lifecycle events that the
// networking module needs at runtime in some versions.
ext.FABRIC_API_MODULES = ["fabric-api-base", "fabric-networking-api-v1", "fabric-key-binding-api-v1",
                          "fabric-lifecycle-events-v1"]

def loaders = []
if (project.findProperty("fabricLoader")) loaders << "fabric"
if (project.findProperty("forge")) loaders << "forge"
if (project.findProperty("neoforge")) loaders << "neoforge"
ext.loaders = loaders

base {
    archivesName = "blendemotes-mc${project.minecraft}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.javaVersion as int)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    if ((project.javaVersion as int) > 8) {
        options.release = project.javaVersion as int // javac 8 has no --release
    }
}

sourceSets {
    loaders.each { l ->
        create(l) {
            compileClasspath += sourceSets.main.output
            runtimeClasspath += sourceSets.main.output
        }
    }
}

repositories {
    maven { url = "https://repo.spongepowered.org/maven" }
    maven { url = "https://maven.neoforged.net/releases" }
    mavenCentral()
}

// Minecraft artifacts (group net.minecraft) are generated locally by Unimined or come from
// Mojang's library server: never ask the other remote mavens for them (a flaky server would
// otherwise fail the build).
repositories.configureEach { repo ->
    if (repo instanceof MavenArtifactRepository) {
        def url = repo.url.toString()
        if (url.startsWith("http") && !url.contains("libraries.minecraft.net")) {
            repo.content { excludeGroupByRegex "net\\.minecraft(\\..*)?" }
        }
    }
}

boolean obfuscated = (project.mcVersion as int) <= 12111

unimined.minecraft {
    version project.minecraft
    if (obfuscated) {
        mappings {
            intermediary()
            mojmap()
        }
    }
    defaultRemapJar = false
}

if (loaders.contains("fabric")) {
    unimined.minecraft(sourceSets.fabric) {
        combineWith(sourceSets.main)
        fabric {
            loader project.fabricLoader
        }
        defaultRemapJar = true
    }
}

if (loaders.contains("forge")) {
    unimined.minecraft(sourceSets.forge) {
        combineWith(sourceSets.main)
        minecraftForge {
            loader project.forge
            mixinConfig "blendemotes.mixins.json"
        }
        defaultRemapJar = true
    }
}

if (loaders.contains("neoforge")) {
    unimined.minecraft(sourceSets.neoforge) {
        combineWith(sourceSets.main)
        neoForge {
            loader project.neoforge
            if ((project.mcVersion as int) < 12005) {
                mixinConfig "blendemotes.mixins.json" // newer NeoForge reads [[mixins]] in neoforge.mods.toml
            }
        }
        defaultRemapJar = true
    }
}

configurations {
    mainImplementation
    implementation {
        loaders.each { l -> extendsFrom configurations.getByName("${l}Implementation") }
    }
}

sourceSets {
    main {
        compileClasspath += configurations.mainImplementation
        runtimeClasspath += configurations.mainImplementation
        // The core (no Minecraft code) is compiled into the mod itself: Forge and NeoForge only let
        // a mod see the classes of its own module, in development runs as well as in the game.
        java.srcDir(rootProject.file("core/src/main/java"))
        resources.srcDir(rootProject.file("core/src/main/resources"))
    }
}

dependencies {
    mainImplementation "org.spongepowered:mixin:0.8.5"
    if (loaders.contains("fabric")) {
        // only the Fabric API modules the mod uses (players with the full Fabric API have them)
        (project.findProperty("fabricApiModules") ?: FABRIC_API_MODULES).each {
            try {
                fabricModImplementation unimined.fabricApi.fabricModule(it, project.fabricApiVersion.toString())
            } catch (Exception e) {
                // keeps the project usable (e.g. for apiDump); compiling the Fabric code will fail
                logger.error("Fabric API ${project.fabricApiVersion} has no module $it: $e")
            }
        }
    }
}

jar {
    enabled = false
}

apply from: rootProject.file("gradle/preprocess.gradle")

def flags = [FABRIC: 0, FORGE: 0, NEOFORGE: 0]
preprocessSourceSet("main", flags)
loaders.each { l ->
    def f = new LinkedHashMap(flags)
    f.put(l.toUpperCase(), 1)
    preprocessSourceSet(l, f)
}

int mc = project.mcVersion as int
int javaLevel = project.javaVersion as int
def resourceProps = [
        version    : project.version.toString(),
        minecraft  : project.minecraft.toString(),
        mcRange    : (project.findProperty("mcRange") ?: "[${project.minecraft}]").toString(),
        fabricMc   : (project.findProperty("fabricMc") ?: project.minecraft).toString(),
        java       : javaLevel.toString(),
        javaMixin  : javaLevel >= 21 ? "JAVA_21" : (javaLevel >= 17 ? "JAVA_17" : "JAVA_8"),
        forgeMajor : (project.findProperty("forge") ?: "0").toString().tokenize(".")[0],
        neoRange   : (project.findProperty("neoRange") ?: "[1,)").toString(),
        // resource pack format of the mod's pack.mcmeta (only Forge up to 1.20.1 ships the file)
        packFormat : (project.findProperty("packFormat") ?: (mc <= 11605 ? "6" : mc <= 11802 ? "8" : mc <= 11902 ? "9" : "15")).toString(),
]
(["main"] + loaders).each { l ->
    tasks.named(sourceSets.getByName(l).processResourcesTaskName) {
        inputs.properties(resourceProps)
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        filesMatching(["fabric.mod.json", "META-INF/mods.toml", "META-INF/neoforge.mods.toml", "pack.mcmeta", "*.mixins.json"]) {
            expand(resourceProps)
        }
        if (l == "forge" && mc > 12001) {
            exclude "pack.mcmeta" // newer Forge generates the mod's pack metadata
        }
        if (l == "neoforge" && mc < 12005) {
            rename "neoforge.mods.toml", "mods.toml" // NeoForge for 1.20.4 still reads mods.toml
        }
    }
}

// CI self-test: ./gradlew :mc-<version>:<loader>RunClient -Pselftest (the workflow also sets
// BLENDEMOTES_SELFTEST=1, which the game reads too)
tasks.withType(JavaExec).configureEach {
    if (project.hasProperty("selftest") && name.toLowerCase().contains("client")) {
        jvmArgs("-Dblendemotes.selftest=true")
    }
}

apply from: rootProject.file("gradle/apidump.gradle")
