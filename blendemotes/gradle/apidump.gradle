// Development helper for CI: prints the signatures of Minecraft / loader classes of this
// version module (the machine that writes the code may not be able to download Minecraft).
//
//   ./gradlew :mc-1.20.1:apiDump -PapiSet=main -PapiClasses=net.minecraft.client.model.geom.ModelPart
//   ./gradlew :mc-1.20.1:apiDump -PapiSet=forge -PapiFind='.*CustomPayload.*'
//   ./gradlew :mc-1.20.1:apiDump -PapiSpec=ci/probe-spec.txt
//
// apiClasses: comma separated class names, printed with javap -p.
// apiFind: regular expression matched against class names on the classpath (only listed).
// apiGrep: only print the members matching this regular expression.
// apiSpec: file with one request per line:
//     @set fabric                    switch source set (main, fabric, forge, neoforge)
//     find: <regex>                  list matching class names
//     <class>                        javap the class
//     <class> | <regex>              javap the class, only members matching the regex
//     <class> #code <regex>          the calls/field accesses made by the methods matching the regex

tasks.register("apiDump") {
    group = "help"
    description = "Prints class signatures from the compile classpath (CI helper)"
    doLast {
        def javapVersion = Math.max(21, (project.findProperty("javaVersion") ?: 21) as int)
        def javaHome = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(javapVersion) }.get()
                .metadata.installationPath.asFile
        def javap = new File(javaHome, "bin/javap").absolutePath

        def jarsOf = { String setName ->
            def sourceSet = project.sourceSets.findByName(setName)
            sourceSet == null ? null : sourceSet.compileClasspath.files.findAll { it.isFile() && it.name.endsWith(".jar") }
        }
        def find = { String setName, String regex ->
            def jars = jarsOf(setName)
            if (jars == null) {
                println("APIDUMP (no source set $setName)")
                return
            }
            def pattern = java.util.regex.Pattern.compile(regex)
            def found = new TreeSet<String>()
            jars.each { jar ->
                new java.util.zip.ZipFile(jar).withCloseable { zip ->
                    zip.entries().each { e ->
                        if (e.name.endsWith(".class")) {
                            def cls = e.name.substring(0, e.name.length() - 6).replace('/', '.')
                            if (pattern.matcher(cls).matches()) {
                                found.add(cls + "   [" + jar.name + "]")
                            }
                        }
                    }
                }
            }
            println("APIDUMP find '$regex' in $setName: ${found.size()} classes")
            found.each { println("APIDUMP   " + it) }
        }
        def dump = { String setName, String cls, String grep ->
            def jars = jarsOf(setName)
            if (jars == null) {
                println("APIDUMP (no source set $setName)")
                return
            }
            def out = new ByteArrayOutputStream()
            project.exec {
                commandLine javap, "-p", "-cp", jars.collect { it.absolutePath }.join(File.pathSeparator), cls
                standardOutput = out
                errorOutput = out
                ignoreExitValue = true
            }
            println("APIDUMP ===== [$setName] $cls")
            def pattern = grep ? java.util.regex.Pattern.compile(grep) : null
            out.toString("UTF-8").eachLine { line ->
                boolean header = !line.startsWith("  ")
                if (pattern == null || header || pattern.matcher(line).find()) {
                    println("APIDUMP " + line)
                }
            }
        }

        def code = { String setName, String cls, String methodRegex ->
            def jars = jarsOf(setName)
            if (jars == null) {
                println("APIDUMP (no source set $setName)")
                return
            }
            def out = new ByteArrayOutputStream()
            project.exec {
                commandLine javap, "-p", "-c", "-cp", jars.collect { it.absolutePath }.join(File.pathSeparator), cls
                standardOutput = out
                errorOutput = out
                ignoreExitValue = true
            }
            println("APIDUMP ===== [$setName] $cls code of /$methodRegex/")
            def pattern = java.util.regex.Pattern.compile(methodRegex)
            boolean inside = false
            out.toString("UTF-8").eachLine { line ->
                if (line.startsWith("  ") && !line.startsWith("   ") && line.contains("(")) {
                    inside = pattern.matcher(line).find()
                    if (inside) {
                        println("APIDUMP " + line)
                    }
                } else if (inside && (line.contains("invoke") || line.contains("field") || line.contains("ldc"))) {
                    int comment = line.indexOf("// ")
                    println("APIDUMP       " + (comment >= 0 ? line.substring(comment + 3) : line.trim()))
                } else if (line.startsWith("Error")) {
                    println("APIDUMP " + line)
                }
            }
        }

        String setName = (project.findProperty("apiSet") ?: "main").toString()
        if (project.findProperty("apiFind")) {
            find(setName, project.findProperty("apiFind").toString())
        }
        if (project.findProperty("apiClasses")) {
            project.findProperty("apiClasses").toString().split(",").each {
                dump(setName, it.trim(), project.findProperty("apiGrep")?.toString())
            }
        }
        if (project.findProperty("apiSpec")) {
            rootProject.file(project.findProperty("apiSpec").toString()).eachLine { raw ->
                def line = raw.trim()
                if (line.isEmpty() || line.startsWith("#")) {
                    return
                }
                if (line.startsWith("@set ")) {
                    setName = line.substring(5).trim()
                } else if (line.startsWith("find:")) {
                    find(setName, line.substring(5).trim())
                } else if (line.contains(" #code ")) {
                    int at = line.indexOf(" #code ")
                    code(setName, line.substring(0, at).trim(), line.substring(at + 7).trim())
                } else {
                    int bar = line.indexOf(" | ")
                    if (bar < 0) {
                        dump(setName, line, null)
                    } else {
                        dump(setName, line.substring(0, bar).trim(), line.substring(bar + 3).trim())
                    }
                }
            }
        }
    }
}
