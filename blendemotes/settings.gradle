pluginManagement {
    repositories {
        maven { url = "https://maven.wagyourtail.xyz/releases" }
        maven { url = "https://maven.wagyourtail.xyz/snapshots" }
        maven { url = "https://maven.neoforged.net/releases" }
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://maven.fabricmc.net/" }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "0.9.0"
}

rootProject.name = "blendemotes"

// Version independent animation core (plain Java 8, no Minecraft).
include "core"

// Minecraft modules. They need the Minecraft / Forge / Fabric mavens; build only the core with
// -PcoreOnly on machines without access to them.
if (!providers.gradleProperty("coreOnly").isPresent()) {
    def only = providers.gradleProperty("mcVersions").getOrElse("")
    def versions = ["1.8.9", "1.12.2", "1.16.5", "1.18.2", "1.19.2", "1.20.1", "1.20.4", "1.21.1", "1.21.4", "1.21.8",
                    "1.21.10", "1.21.11", "26.1.2", "26.3"]
    versions.each { v ->
        if (only.isEmpty() || only.split(",").contains(v)) {
            include "mc-$v"
            project(":mc-$v").projectDir = file("versions/$v")
        }
    }
}
