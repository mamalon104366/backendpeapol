plugins {
    id "java"
    id "xyz.wagyourtail.unimined"
}

// Minecraft 1.20.4: everything else is in gradle/modern.gradle and shared/modern.
ext {
    minecraft = "1.20.4"
    mcVersion = 12004
    javaVersion = 17
    fabricLoader = "0.19.5"
    fabricApiVersion = "0.97.3+1.20.4"
    forge = "49.2.9"
    neoforge = "net.neoforged:neoforge:20.4.251:universal"
}

apply from: rootProject.file("gradle/modern.gradle")
