plugins {
    id "java"
    id "xyz.wagyourtail.unimined"
}

// Minecraft 26.1.2: everything else is in gradle/modern.gradle and shared/modern.
ext {
    minecraft = "26.1.2"
    mcVersion = 260102
    javaVersion = 25
    fabricLoader = "0.19.5"
    fabricApiVersion = "0.155.3+26.1.2"
    forge = "64.1.3"
    neoforge = "net.neoforged:neoforge:26.1.2.109:universal"
    // Fabric API renamed the key binding module for the Mojang names of 26.x
    fabricApiModules = ["fabric-api-base", "fabric-networking-api-v1", "fabric-key-mapping-api-v1",
                        "fabric-lifecycle-events-v1"]
    // classes Mojang renamed or moved (whole words, see gradle/preprocess.gradle)
    preprocessRenames = [
            [12111, "ResourceLocation", "Identifier"],
            [12111, "net.minecraft.client.model.PlayerModel", "net.minecraft.client.model.player.PlayerModel"],
            [12111, "net.minecraft.client.renderer.RenderType", "net.minecraft.client.renderer.rendertype.RenderType"],
            [12111, "net.minecraft.world.level.GameRules", "net.minecraft.world.level.gamerules.GameRules"],
            [260100, "state.CameraRenderState", "state.level.CameraRenderState"],
            [260100, "state/CameraRenderState", "state/level/CameraRenderState"]
    ]
}

apply from: rootProject.file("gradle/modern.gradle")
