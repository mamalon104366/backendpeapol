plugins {
    id "java"
    id "xyz.wagyourtail.unimined" version "${unimined_version}"
}

// Minecraft 1.21.11: everything else is in gradle/modern.gradle and shared/modern.
ext {
    minecraft = "1.21.11"
    mcVersion = 12111
    javaVersion = 21
    fabricLoader = "0.19.5"
    fabricApi = "0.141.6+1.21.11"
    forge = "61.2.1"
    neoforge = "net.neoforged:neoforge:21.11.45:universal"
}

apply from: rootProject.file("gradle/modern.gradle")
