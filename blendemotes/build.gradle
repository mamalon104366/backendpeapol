// The Minecraft modules share one Unimined plugin, loaded here together with an ASM new enough
// for Minecraft 26.x (compiled for Java 25). Core-only builds (-PcoreOnly) skip both.
buildscript {
    repositories {
        mavenLocal { // Unimined built by tools/unimined/build.sh
            content { includeGroup "xyz.wagyourtail.unimined" }
        }
        maven { url = "https://maven.wagyourtail.xyz/releases" }
        maven { url = "https://maven.wagyourtail.xyz/snapshots" }
        gradlePluginPortal()
        mavenCentral()
    }
    if (!project.hasProperty("coreOnly")) {
        dependencies {
            classpath "xyz.wagyourtail.unimined:xyz.wagyourtail.unimined.gradle.plugin:${project.property("unimined_version")}"
            ["asm", "asm-commons", "asm-tree", "asm-analysis", "asm-util"].each {
                classpath "org.ow2.asm:$it:${project.property("asm_version")}"
            }
        }
    }
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    repositories {
        mavenCentral()
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
    }
}
